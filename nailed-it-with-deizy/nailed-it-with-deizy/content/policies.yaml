items:
  - title: Turnaround
    body: >-
      Custom sets take a few days to make. I'll message you when your set
      ships or is ready for pickup.
  - title: Shipping and pickup
    body: >-
      Sets can be shipped to you or picked up locally. Pickup details are
      shared after you order.
  - title: Damaged or doesn't fit
    body: >-
      If your set arrives damaged or doesn't fit right, send me a photo and
      let's talk. I'll work with you to make it right.
  - title: Sizing
    body: >-
      Every set is made to your sizes, so please double-check your
      measurements or send sizing photos before ordering.
