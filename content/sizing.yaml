intro: >-
  A good fit is everything. Measure at home, or skip the ruler and send me a
  few photos. I'll measure for you.
guideImage: /images/sizing/photo-guide.jpg
guidePdf: /downloads/sizing-guide.pdf
shapes:
  - Square
  - Almond
  - Coffin
lengths:
  - Short
  - Medium
  - Long
sections:
  - title: Send photos (easiest)
    steps:
      - Place your left hand flat on a table in good light and take a clear photo.
      - Take a clear photo of your right hand the same way.
      - Take a close-up of each thumb with a quarter next to it, not on top of it.
      - Keep the quarter and your nails on the same flat surface and in focus.
      - Send the photos with the shape and length you'd like.
  - title: Measure yourself
    steps:
      - Lay a strip of clear tape across the widest part of each nail.
      - Mark both edges of the nail on the tape with a fine pen.
      - Stick the tape on a ruler and write down each width in millimeters.
      - Send me all ten measurements, thumb to pinky, for both hands.
  - title: Apply your set
    steps:
      - Wash your hands, push back your cuticles and lightly buff each nail.
      - Wipe each nail with the alcohol prep pad so it's clean and dry.
      - Use nail glue for longer wear, or adhesive tabs for a few days.
      - Press each nail on at an angle, starting at the cuticle, and hold for 20 to 30 seconds.
  - title: Remove and reuse
    steps:
      - Soak your fingertips in warm, soapy water for 10 to 15 minutes.
      - Gently lift from the sides with the cuticle stick. Never force a nail off.
      - Buff away leftover glue from the back of each press-on.
      - Keep your set in its storage bag so it's ready to wear again.
