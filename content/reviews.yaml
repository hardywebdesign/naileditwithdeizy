items:
  - quote: >-
      My nails are absolutely beautiful and spooky, just the way I like
      them, even better than I imagined. I love them!
    name: Courtney
  - quote: >-
      I love, love, love! The nails are sized for my fingers and custom made to
      my liking. I prefer to keep up with the seasons or time of year. Having
      them custom painted lets me do that by ordering seasonal.
    name: LuAnn
  - quote: >-
      I had an odd request for only 2 nails. I sent a picture of what I had in
      mind, and Dez was able to make them both even better than I expected! My
      go-to nail girl now!
    name: Chris
  - quote: >-
      I absolutely love Deizy's press-on nails! They are beautifully painted,
      high quality, and look like I just had a professional manicure done. I
      also love that they're less damaging to my natural nails and so much
      easier to change when I want a new look. I highly recommend Deizy's
      press-on nails to anyone.
    name: Julia
