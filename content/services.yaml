items:
  - name: Custom sets
    summary: >-
      Send me your idea, a photo, or just a vibe, and I'll hand-paint a set
      sized to your nails. Odd requests are welcome, even just two nails.
    details:
      - Square, almond or coffin shape
      - Short, medium or long
      - Ready in a few days
    photo: /images/gallery/haunted-garden.jpg
    buttonLabel: Request a custom set
    buttonLink: /book
  - name: Ready-made sets
    summary: >-
      Pick any design from the gallery and I'll paint it in your size.
    details:
      - New seasonal designs
      - Ordered in your size
      - Shipping or local pickup
    photo: /images/gallery/ruby-chrome.jpg
    buttonLabel: Browse the gallery
    buttonLink: /gallery
  - name: Sizing kits
    summary: >-
      Not sure of your size? Try a sizing kit at home first, or skip it and
      send me photos so I can measure for you.
    details:
      - Try every size at home
      - Or send photos with a quarter
      - Order your set knowing it fits
    photo: /images/gallery/lilac-gems.jpg
    buttonLabel: Ask about a sizing kit
    buttonLink: /contact?topic=sizing
