heading: Hi, I'm Deizy.
intro: >-
  I hand-paint custom press-on nails, sized to fit you and made to match the
  season.
story:
  - >-
    I've been doing my own nails for a few years. I've always loved art and
    precision, and once I figured out my techniques, I started showing my nails
    off. People started asking questions, and then they started asking for sets
    of their own.
  - >-
    That's how Nailed It With Deizy started. Every set is painted by hand,
    sized from your measurements or photos, and made to match whatever you're
    into, from spooky to sweet.
  - >-
    I'm a people person, and my favorite part is seeing the real excitement on
    someone's face when they see their set for the first time.
photo: /images/about/deizy-at-work.jpg
photoAlt: Deizy holding a finished set of purple and gold press-on nails
