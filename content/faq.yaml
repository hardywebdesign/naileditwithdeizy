questions:
  - question: How much are sets?
    answer: >-
      Sets start at $20. Custom art, length and charms can change the price,
      and I'll confirm your exact price during your consultation. Tips are
      always appreciated.
  - question: How long does a custom set take?
    answer: >-
      A few days to make. I'll let you know when it ships or is ready for
      pickup.
  - question: Do you ship or offer pickup?
    answer: Both. Just let me know which works for you during your consultation.
  - question: How do I find my size?
    answer: >-
      The easiest way is to send me a few photos of your hands with a quarter
      next to your thumb, and I'll measure for you. The Sizing page shows how.
  - question: Can I ask for something unusual?
    answer: >-
      Yes. Send a photo or describe what you have in mind, even if it's just
      a couple of nails.
  - question: What comes with my set?
    answer: >-
      Nail glue, adhesive tabs, a nail file, a cuticle stick, an alcohol prep
      pad and a storage bag.
  - question: Can I reuse my nails?
    answer: >-
      Yes. Remove them gently, clean off the old glue and keep them in the
      storage bag to wear again.
  - question: What are appointments for?
    answer: >-
      Every order starts with a free 15-minute consultation by Zoom or phone.
      We'll go over the set you want, your sizes, shape and length. Book one
      any day from 9am to 9pm, or tap Request this set under any design in the
      gallery.
  - question: How do I pay?
    answer: >-
      After your consultation, I'll send you a secure payment link. You can pay
      with a card, Cash App Pay, Apple Pay or Google Pay.
